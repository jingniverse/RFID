<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방문요양 스마트 허브 - 로컬 서버</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f13;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #a855f7;
      --primary-glow: rgba(168, 85, 247, 0.4);
      --success: #10b981;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      background-color: var(--bg);
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Background glow effect */
    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      right: -100px;
      filter: blur(30px);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--success);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .url {
      color: var(--primary);
      font-family: monospace;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .desc {
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.5;
      margin: 0 0 28px 0;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .footer-note {
      font-size: 11px;
      color: #475569;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>로컬 서버 실행 중</span>
    </div>
    <h1>스마트 홈케어 기록지 허브</h1>
    <div class="url">http://localhost:3001</div>
    <p class="desc">
      크롬(Chrome) 또는 엣지(Edge) 브라우저가 자동 실행되었습니다.<br>
      웹 브라우저 화면에서 안심하고 기록지를 작성해 주세요!
    </p>
    <div class="btn-group">
      <!-- target="_blank" pointing to localhost opens in system default browser -->
      <a href="http://localhost:3001" target="_blank" class="btn btn-primary">
        🌐 웹 브라우저에서 화면 열기
      </a>
      <button onclick="closeServer()" class="btn btn-secondary">
        ❌ 서버 종료 및 프로그램 닫기
      </button>
    </div>
    <div class="footer-note">
      ※ 이 대시보드 창을 닫으면 실행 중인 서버도 함께 종료됩니다.
    </div>
  </div>

  <script>
    function closeServer() {
      // Send message to Electron main process to close
      if (window.api && window.api.closeApp) {
        window.api.closeApp();
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
